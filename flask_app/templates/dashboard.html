<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stock Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .stock-card { cursor: pointer; transition: transform 0.2s; }
        .stock-card:hover { transform: scale(1.03); border-color: #38bdf8; }
        .stock-card.active { border-color: #38bdf8; background-color: #1e3a5f; }
        .price { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
        .volume { font-size: 0.85rem; color: #94a3b8; }
        .badge-live { background-color: #22c55e; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        h1 { color: #38bdf8; }
    </style>
</head>
<body>
<div class="container-fluid py-4 px-4">

    <!-- Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <h1 class="mb-0">📈 Live Stock Dashboard</h1>
        <span class="badge badge-live text-white px-3 py-2 rounded-pill">● LIVE</span>
    </div>

    <!-- Stock Cards -->
    <div class="row g-3 mb-4" id="stockCards"></div>

    <!-- Chart -->
    <div class="card p-4">
        <h5 class="mb-3" id="chartTitle" style="color:#94a3b8;">
            Click on a stock card to see price history
        </h5>
        <canvas id="priceChart" height="80"></canvas>
    </div>

</div>

<script>
    let chart = null;
    let selectedSymbol = null;

    // --- Render stock cards ---
    async function loadLatestPrices() {
        const res = await fetch('/api/latest');
        const data = await res.json();

        const container = document.getElementById('stockCards');
        container.innerHTML = '';

        data.forEach(stock => {
            const col = document.createElement('div');
            col.className = 'col-6 col-md-4 col-lg-2';
            col.innerHTML = `
                <div class="card stock-card p-3 text-center ${stock.symbol === selectedSymbol ? 'active' : ''}"
                     onclick="loadChart('${stock.symbol}')">
                    <div class="fw-bold mb-1" style="color:#cbd5e1">${stock.symbol}</div>
                    <div class="price">₹${stock.price.toFixed(2)}</div>
                    <div class="volume">Vol: ${stock.volume.toLocaleString()}</div>
                    <div class="volume mt-1">${stock.timestamp.slice(11,19)}</div>
                </div>`;
            container.appendChild(col);
        });
    }

    // --- Load price history chart ---
    async function loadChart(symbol) {
        selectedSymbol = symbol;
        const res = await fetch(`/api/history/${symbol}`);
        const data = await res.json();

        const labels = data.map(d => d.timestamp.slice(11, 19));
        const prices = data.map(d => d.price);

        document.getElementById('chartTitle').textContent =
            `${symbol} — Price History (Last 20 records)`;

        if (chart) chart.destroy();

        const ctx = document.getElementById('priceChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: `${symbol} Price (₹)`,
                    data: prices,
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56,189,248,0.1)',
                    borderWidth: 2,
                    pointRadius: 4,
                    pointBackgroundColor: '#38bdf8',
                    tension: 0.4,
                    fill: true,
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: '#e2e8f0' } } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                }
            }
        });

        loadLatestPrices();  // refresh cards too
    }

    // --- Auto refresh every 3 seconds ---
    loadLatestPrices();
    setInterval(() => {
        loadLatestPrices();
        if (selectedSymbol) loadChart(selectedSymbol);
    }, 3000);
</script>
</body>
</html>
